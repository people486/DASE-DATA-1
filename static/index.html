<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问卷工作台</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a href="/">问卷工作台</a><span id="identity"></span><button id="logout" hidden>退出登录</button></header><main><div id="notice" role="status"></div><section id="auth"><h1>登录后开始创建或填写问卷</h1><p>第一阶段 · MongoDB 问卷系统</p><form id="authform"><label>用户名<input id="username" minlength="2" maxlength="40" required autocomplete="username"></label><label>密码<input id="password" type="password" minlength="8" maxlength="200" required autocomplete="current-password"></label><button name="action" value="login">登录</button><button name="action" value="register" class="secondary">注册</button></form></section><section id="workspace" hidden></section></main><script src="/static/app.js"></script></body></html>
